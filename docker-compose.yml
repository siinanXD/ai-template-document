services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter
      POSTGRES_DB: starter
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - document_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d starter"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  document_pgdata:
